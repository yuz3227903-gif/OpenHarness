<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI帮投研助手 · 协作工作台</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="rail">
      <div class="brand-mark">研</div>
      <button class="rail-btn active" title="协作频道">▣</button>
      <button class="rail-btn" title="任务">✓</button>
      <button class="rail-btn" title="文件">⌕</button>
      <div class="rail-spacer"></div>
      <div class="rail-avatar">ZY</div>
    </aside>
    <aside class="sidebar">
      <div class="workspace-head"><div><strong>AI帮投研助手</strong><span>本地工作区</span></div><button id="new-research">＋</button></div>
      <div class="sidebar-section"><div class="section-title">频道 <button id="create-channel" title="创建研究频道">＋</button></div><div id="channel-list"></div></div>
      <div class="sidebar-section"><div class="section-title">Agent <span><b id="agent-count">7</b><button id="create-agent" title="创建 Agent">＋</button></span></div><div id="agent-list" class="agent-list"></div></div>
      <div class="sidebar-note">演示数据与真实运行记录保存在本机项目目录。<br>“工作台”只记录状态，不参与研究判断。</div>
    </aside>
    <main class="main-pane">
      <header class="channel-head"><div><div class="eyebrow">投研协作频道</div><h1># 科大讯飞研究室</h1><p>人类与多个 Agent 的研究交接、任务和交付</p></div><div class="head-actions"><span class="live-dot"></span><span id="connection-state">正在连接</span><button id="pause-run" class="secondary" type="button">暂停项目</button><button id="resume-run" class="secondary" type="button" hidden>继续项目</button><button id="refresh">刷新</button></div></header>
      <div class="run-banner" id="run-banner"><span class="status-dot"></span><span id="run-label">等待研究任务</span><span id="run-meta"></span></div>
      <nav class="pane-tabs" id="pane-tabs"><button type="button" class="pane-tab active" data-pane="chat">聊天</button><button type="button" class="pane-tab" data-pane="tasks">任务 <b id="tab-task-count">0</b></button><button type="button" class="pane-tab" data-pane="files">文件 <b id="tab-file-count">0</b></button></nav>
      <section id="message-list" class="message-list pane-view" data-pane-view="chat"></section>
      <section id="task-board" class="task-board pane-view" data-pane-view="tasks" hidden></section>
      <section id="file-board" class="file-board pane-view" data-pane-view="files" hidden></section>
      <form id="composer" class="composer"><div class="composer-hint">发送消息给 #科大讯飞研究室</div><textarea id="message-input" rows="2" placeholder="输入消息，例如：@Fundamental 请补充最近一年经营变化"></textarea><div id="attachment-tray" class="attachment-tray" hidden></div><div class="composer-footer"><span class="composer-tip">@Planner 启动完整研究；@其他 Agent 创建直接任务，可同时 @多个 Agent</span><div><label class="attach-btn" title="上传图片或文件">＋ 附件<input id="attachment-input" type="file" multiple hidden></label><button type="button" id="report-btn" class="secondary">查看报告</button><button type="submit" class="send">发送</button></div></div><div id="mention-menu" class="mention-menu"></div></form>
    </main>
    <aside class="context-pane"><div class="context-head"><span>上下文</span><button id="close-context">×</button></div><div id="context-content" class="context-content"><div class="empty-context"><div class="context-icon">◎</div><h2>研究协作室</h2><p>选择 Agent、任务或消息，查看它的角色、状态和交付内容。</p><button id="start-default" class="primary">研究科大讯飞</button></div></div></aside>
  </div>
  <dialog id="agent-dialog" class="workbench-dialog"><form id="agent-form"><div class="dialog-head"><div><strong id="agent-dialog-title">创建 Agent</strong><span id="agent-dialog-subtitle">配置一个可以加入频道协作的研究成员</span></div><button type="button" data-close="agent-dialog">×</button></div><label>名称<input name="name" maxlength="80" required></label><label>个人简介<textarea name="profile" maxlength="500" required></textarea></label><label>职责<input name="role" maxlength="120" required></label><label>系统提示词<textarea name="system_prompt" rows="6" maxlength="12000" required></textarea></label><label>模型<select name="model"><option value="ark-code-latest">Ark Code Latest · Auto</option></select><small id="model-description" class="model-description">默认使用效果与速度双维度智能调度。</small></label><label>头像图片<div class="avatar-editor"><img id="agent-avatar-preview" alt="头像预览" hidden><input name="avatar" type="file" accept="image/png,image/jpeg,image/webp,image/gif"><small>不选择新图片时保留现有头像，最大 2 MB</small></div></label><div class="dialog-actions"><button type="button" class="secondary" data-close="agent-dialog">取消</button><button id="agent-submit" class="primary" type="submit">创建 Agent</button></div></form></dialog>
  <dialog id="channel-dialog" class="workbench-dialog"><form id="channel-form"><div class="dialog-head"><div><strong>创建研究频道</strong><span>一个频道对应一个研究课题和根任务</span></div><button type="button" data-close="channel-dialog">×</button></div><label>频道名称<input name="name" maxlength="80" required></label><label>研究课题<input name="topic" maxlength="240" required></label><label>课题说明<textarea name="description" maxlength="1000"></textarea></label><fieldset><legend>选择 Agent（至少一个）</legend><div id="channel-agent-options" class="agent-options"></div></fieldset><div class="dialog-actions"><button type="button" class="secondary" data-close="channel-dialog">取消</button><button class="primary" type="submit">创建频道</button></div></form></dialog>
  <div id="toast" class="toast"></div>
  <script src="/app.js"></script>
</body>
</html>
