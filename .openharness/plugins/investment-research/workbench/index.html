<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI帮投研助手 · 协作工作台</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <!-- Icon sprite: Lucide (ISC licence, https://lucide.dev). Inlined because a
       strict local server cannot fetch an icon font or CDN bundle. Every symbol
       keeps Lucide's 24x24 grid so stroke weights stay consistent at any size. -->
  <svg class="icon-sprite" aria-hidden="true" focusable="false"><defs>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></symbol>
    <symbol id="i-message" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></symbol>
    <symbol id="i-tasks" viewBox="0 0 24 24"><path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/></symbol>
    <symbol id="i-check-square" viewBox="0 0 24 24"><path d="m9 11 3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></symbol>
    <symbol id="i-paperclip" viewBox="0 0 24 24"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></symbol>
    <symbol id="i-graph" viewBox="0 0 24 24"><line x1="6" x2="6" y1="3" y2="15"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5v14"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></symbol>
    <symbol id="i-hash" viewBox="0 0 24 24"><line x1="4" x2="20" y1="9" y2="9"/><line x1="4" x2="20" y1="15" y2="15"/><line x1="10" x2="8" y1="3" y2="21"/><line x1="16" x2="14" y1="3" y2="21"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.09-3.09a2 2 0 0 0-2.82 0L6 21"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M16 13H8"/><path d="M16 17H8"/><path d="M10 9H8"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><polygon points="6 3 20 12 6 21 6 3"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><rect x="14" y="4" width="4" height="16" rx="1"/><rect x="6" y="4" width="4" height="16" rx="1"/></symbol>
    <symbol id="i-report" viewBox="0 0 24 24"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></symbol>
    <symbol id="i-reply" viewBox="0 0 24 24"><path d="m9 17-5-5 5-5"/><path d="M4 12h11a5 5 0 0 1 0 10h-1"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="10" r="3"/><path d="M7 20.66V19a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v1.66"/></symbol>
    <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M21.17 2.83a3.12 3.12 0 0 0-4.42 0L3 16.59V21h4.41L21.17 7.25a3.12 3.12 0 0 0 0-4.42z"/><path d="m15.5 4.5 4 4"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></symbol>
    <symbol id="i-puzzle" viewBox="0 0 24 24"><path d="M15.39 4.39a1 1 0 0 0 1.68-.474 2.5 2.5 0 1 1 3.014 3.015 1 1 0 0 0-.474 1.68l1.683 1.682a2.414 2.414 0 0 1 0 3.414L19.61 15.39a1 1 0 0 1-1.68-.474 2.5 2.5 0 1 0-3.014 3.015 1 1 0 0 1 .474 1.68l-1.683 1.682a2.414 2.414 0 0 1-3.414 0L8.61 19.61a1 1 0 0 0-1.68.474 2.5 2.5 0 1 1-3.014-3.015 1 1 0 0 0 .474-1.68l-1.683-1.682a2.414 2.414 0 0 1 0-3.414L4.39 8.61a1 1 0 0 1 1.68.474 2.5 2.5 0 1 0 3.014-3.015 1 1 0 0 1-.474-1.68l1.683-1.682a2.414 2.414 0 0 1 3.414 0z"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5"/><path d="M12 3v12"/></symbol>
    <symbol id="i-sparkle" viewBox="0 0 24 24"><path d="M12 3v4"/><path d="M12 17v4"/><path d="M3 12h4"/><path d="M17 12h4"/><path d="m5.6 5.6 2.8 2.8"/><path d="m15.6 15.6 2.8 2.8"/><path d="m18.4 5.6-2.8 2.8"/><path d="m8.4 15.6-2.8 2.8"/></symbol>
  </defs></svg>
  <div class="app-shell">
    <aside class="rail">
      <div class="brand-mark">研</div>
      <button class="rail-btn" data-pane="search" title="搜索 (Ctrl+K)"><svg class="icon"><use href="#i-search"/></svg></button>
      <button class="rail-btn active" data-pane="chat" title="协作频道"><svg class="icon"><use href="#i-message"/></svg></button>
      <button class="rail-btn" data-pane="tasks" title="任务"><svg class="icon"><use href="#i-check-square"/></svg></button>
      <button class="rail-btn" data-pane="files" title="文件"><svg class="icon"><use href="#i-paperclip"/></svg></button>
      <button class="rail-btn" data-pane="graph" title="关系图"><svg class="icon"><use href="#i-graph"/></svg></button>
      <div class="rail-spacer"></div>
      <div class="rail-avatar">ZY</div>
    </aside>
    <aside class="sidebar" id="sidebar">
      <div class="workspace-head"><div><strong id="sidebar-title">聊天</strong><span id="sidebar-subtitle">本地工作区</span></div><button id="sidebar-action" title="新建"><svg class="icon"><use href="#i-plus"/></svg></button></div>
      <div id="sidebar-body"></div>
      <div class="sidebar-note" id="sidebar-note">演示数据与真实运行记录保存在本机项目目录。<br>“工作台”只记录状态，不参与研究判断。</div>
    </aside>
    <main class="main-pane">
      <header class="channel-head"><div><div class="eyebrow">投研协作频道</div><h1>加载中…</h1><p>正在读取当前频道</p></div><div class="head-actions"><span class="live-dot"></span><span id="connection-state">正在连接</span><button id="pause-run" class="secondary" type="button"><svg class="icon"><use href="#i-pause"/></svg> 暂停项目</button><button id="resume-run" class="secondary" type="button" hidden><svg class="icon"><use href="#i-play"/></svg> 继续项目</button><button id="refresh"><svg class="icon"><use href="#i-refresh"/></svg> 刷新</button></div></header>
      <div class="run-banner" id="run-banner"><span class="status-dot"></span><span id="run-label">等待研究任务</span><span id="run-meta"></span></div>
      <nav class="pane-tabs" id="pane-tabs"><button type="button" class="pane-tab active" data-pane="chat"><svg class="icon"><use href="#i-message"/></svg> 聊天</button><button type="button" class="pane-tab" data-pane="tasks"><svg class="icon"><use href="#i-tasks"/></svg> 任务 <b id="tab-task-count">0</b></button><button type="button" class="pane-tab" data-pane="files"><svg class="icon"><use href="#i-paperclip"/></svg> 文件 <b id="tab-file-count">0</b></button><button type="button" class="pane-tab" data-pane="graph"><svg class="icon"><use href="#i-graph"/></svg> 关系图 <b id="tab-edge-count">0</b></button></nav>
      <section id="message-list" class="message-list pane-view" data-pane-view="chat"></section>
      <section id="task-board" class="task-board pane-view" data-pane-view="tasks" hidden></section>
      <section id="file-board" class="file-board pane-view" data-pane-view="files" hidden></section>
      <section id="graph-board" class="graph-board pane-view" data-pane-view="graph" hidden></section>
      <section id="search-board" class="search-board pane-view" data-pane-view="search" hidden>
        <div class="search-bar"><svg class="icon"><use href="#i-search"/></svg><input id="search-input" type="search" placeholder="搜索频道、私信、消息…" autocomplete="off"><kbd id="search-hint">Ctrl+K</kbd><button type="button" id="search-close" class="secondary">ESC</button></div>
        <div class="search-filters">
          <label class="search-filter"><svg class="icon"><use href="#i-user"/></svg><select id="search-sender"><option value="">发送者</option></select></label>
          <label class="search-filter"><svg class="icon"><use href="#i-sparkle"/></svg><select id="search-scope"><option value="all">范围</option><option value="message">消息</option><option value="task">任务</option><option value="file">文件</option><option value="agent">成员</option><option value="channel">频道</option></select></label>
          <label class="search-filter"><svg class="icon"><use href="#i-hash"/></svg><select id="search-channel"><option value="">频道</option></select></label>
          <label class="search-filter"><svg class="icon"><use href="#i-refresh"/></svg><select id="search-since"><option value="0">不限时间</option><option value="1">最近一天</option><option value="7">最近一周</option><option value="30">最近一月</option></select></label>
          <label class="search-filter"><svg class="icon"><use href="#i-tasks"/></svg><select id="search-sort"><option value="relevance">相关度</option><option value="recent">最新</option></select></label>
        </div>
        <div id="search-results" class="search-results"></div>
      </section>
      <form id="composer" class="composer"><div class="composer-hint">发送消息</div><textarea id="message-input" rows="2" placeholder="输入消息，例如：@Fundamental 请补充最近一年经营变化"></textarea><div id="attachment-tray" class="attachment-tray" hidden></div><div class="composer-footer"><span class="composer-tip">@Planner 启动完整研究；@其他 Agent 创建直接任务，可同时 @多个 Agent</span><div><label class="attach-btn" title="上传图片或文件"><svg class="icon"><use href="#i-image"/></svg><svg class="icon"><use href="#i-paperclip"/></svg><input id="attachment-input" type="file" multiple hidden></label><button type="button" id="report-btn" class="secondary"><svg class="icon"><use href="#i-report"/></svg> 查看报告</button><button type="submit" class="send"><svg class="icon"><use href="#i-send"/></svg> 发送</button></div></div><div id="mention-menu" class="mention-menu"></div></form>
    </main>
    <aside class="context-pane"><div class="context-head"><span><svg class="icon"><use href="#i-user"/></svg> 上下文</span><button id="close-context" title="关闭"><svg class="icon"><use href="#i-x"/></svg></button></div><div id="context-content" class="context-content"><div class="empty-context"><div class="context-icon"><svg class="icon"><use href="#i-sparkle"/></svg></div><h2>研究协作室</h2><p>选择 Agent、任务或消息，查看它的角色、状态和交付内容。</p><button id="start-default" class="primary">研究科大讯飞</button></div></div></aside>
  </div>
  <dialog id="agent-dialog" class="workbench-dialog"><form id="agent-form"><div class="dialog-head"><div><strong id="agent-dialog-title">创建 Agent</strong><span id="agent-dialog-subtitle">配置一个可以加入频道协作的研究成员</span></div><button type="button" data-close="agent-dialog"><svg class="icon"><use href="#i-x"/></svg></button></div><label>名称<input name="name" maxlength="80" required></label><label>个人简介<textarea name="profile" maxlength="500" required></textarea></label><label>职责<input name="role" maxlength="120" required></label><label>系统提示词<textarea name="system_prompt" rows="6" maxlength="12000" required></textarea></label><label>模型<select name="model"><option value="ark-code-latest">Ark Code Latest · Auto</option></select><small id="model-description" class="model-description">默认使用效果与速度双维度智能调度。</small></label><label>头像图片<div class="avatar-editor"><img id="agent-avatar-preview" alt="头像预览" hidden><input name="avatar" type="file" accept="image/png,image/jpeg,image/webp,image/gif"><small>不选择新图片时保留现有头像，最大 2 MB</small></div></label><div class="dialog-actions"><button type="button" class="secondary" data-close="agent-dialog">取消</button><button id="agent-submit" class="primary" type="submit">创建 Agent</button></div></form></dialog>
  <dialog id="channel-dialog" class="workbench-dialog"><form id="channel-form"><div class="dialog-head"><div><strong id="channel-dialog-title">创建研究频道</strong><span id="channel-dialog-subtitle">一个频道对应一个研究课题和根任务</span></div><button type="button" data-close="channel-dialog"><svg class="icon"><use href="#i-x"/></svg></button></div><label>频道名称<input name="name" maxlength="80" required></label><label>研究课题<input name="topic" maxlength="240" required></label><label>课题说明<textarea name="description" maxlength="1000"></textarea></label><fieldset id="channel-members-field"><legend>选择 Agent（至少一个）</legend><div id="channel-agent-options" class="agent-options"></div></fieldset><div class="dialog-actions"><button type="button" class="secondary" data-close="channel-dialog">取消</button><button id="channel-submit" class="primary" type="submit">创建频道</button></div></form></dialog>
  <dialog id="dm-dialog" class="workbench-dialog"><form id="dm-form"><div class="dialog-head"><div><strong>发起私信</strong><span>选择一个 Agent，开一条只有你和它的对话</span></div><button type="button" data-close="dm-dialog"><svg class="icon"><use href="#i-x"/></svg></button></div><fieldset><legend>选择对话对象</legend><div id="dm-agent-options" class="agent-options"></div></fieldset><div class="dialog-actions"><button type="button" class="secondary" data-close="dm-dialog">取消</button><button class="primary" type="submit">开始对话</button></div></form></dialog>
  <div id="toast" class="toast"></div>
  <!-- D3 v7 (ISC licence), vendored because this server has no outbound fetch. -->
  <script src="/vendor/d3.v7.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
